name: Publish experimental release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v0.1.0)"
        required: true
        default: "v0.2.3"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version tag"
            exit 1
          fi

      - name: Build source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=bmwweather-${{ inputs.version }}/ HEAD -o dist/bmwweather-${{ inputs.version }}-source.zip
          sha256sum dist/bmwweather-${{ inputs.version }}-source.zip > dist/SHA256SUMS.txt

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: main
          name: BMW Weather Bridge ${{ inputs.version }}
          prerelease: true
          generate_release_notes: true
          body: |
            **Experimental pre-release v0.2.3. The bridge runs as UID 12256 with GID 12214; component metadata grants UID 12256 access through mgu-uplink. Weather data from wttr.in JSON is normalized and written to the native Weather OAP cache.**

            This package fetches weather from wttr.in JSON (format=j1) and writes a candidate payload to the native BMW Weather cache. No API key is required. DNS resolution follows the BMWCamInfo mgu-uplink model.

            Install through MGU Store. The service writes a non-root-readable diagnostic report to `/var/opt/public/oap/oap_12214/data/bmwweather-diagnostics.json` and emits `DIAG` lines to its journal. The report checks service UID/GID, MGU uplink lease, DNS, wttr.in HTTPS, forecast parsing, native payload validation, and cache write/read-back.
          files: |
            dist/bmwweather-${{ inputs.version }}-source.zip
            dist/SHA256SUMS.txt
