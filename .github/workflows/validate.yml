name: Validate BMW Weather components

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check native/andrug_bmwweather_bridge/bridge.js
          node --check native/andrug_bmwweather_bridge/uplink.js
          node --check native/andrug_bmwweather_diagnostics/diagnostics.js
          node --check apps/andrug_bmwweather_diagnostics/src/diagnostics.js
          grep -q "bmwweather-diagnostics.json" native/andrug_bmwweather_bridge/bridge.js
          grep -q "bmwweather-diagnostics.txt" native/andrug_bmwweather_diagnostics/diagnostics.js
          echo "Bridge, background diagnostics and native RHMI app syntax OK"
      - name: Validate JSON manifests
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'native/andrug_bmwweather_bridge/component.json',
            'native/andrug_bmwweather_bridge/config.json',
            'native/andrug_bmwweather_diagnostics/component.json',
            'apps/andrug_bmwweather_diagnostics/mgu-app.json',
            'apps/andrug_bmwweather_diagnostics/package/package.json',
            'apps/andrug_bmwweather_diagnostics/package/manifest.json',
            'apps/andrug_bmwweather_diagnostics/package/permissions.json',
            'apps/andrug_bmwweather_diagnostics/package/rhmiData/application.json',
            'apps/andrug_bmwweather_diagnostics/package/rhmiData/uiDescriptions/ID7/uiDescription.json',
            'config.example.json',
            'mgu-repo.json'
          ];
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          const repo = JSON.parse(fs.readFileSync('mgu-repo.json', 'utf8'));
          if (!repo.components.some(x => x.id === 'andrug-bmwweather-diagnostics')) throw new Error('Background diagnostics tool missing from repo tree');
          if (!repo.components.some(x => x.id === 'andrug_bmwweather_diagnostics' && x.kind === 'app' && x.build === 'unit')) throw new Error('Native RHMI app missing from repo tree');
          console.log('JSON manifests and MGU repo tree OK');
          NODE
      - name: Probe wttr.in API
        run: |
          curl --fail --silent --show-error \
            -A "BMWWeatherDiagnostics/0.1.0 https://github.com/andrug05/bmwweather/issues" \
            "https://wttr.in/Yoshkar-Ola?format=j1&lang=ru" \
            -o /tmp/wttr-weather.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/wttr-weather.json','utf8')); if (!Array.isArray(x.weather) || !x.weather.length || !Array.isArray(x.current_condition) || !x.current_condition.length) process.exit(1); console.log('wttr.in forecast OK:', x.weather.length, 'days')"
