name: Validate BMW Weather Bridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check native/andrug_bmwweather_bridge/bridge.js
          node --check native/andrug_bmwweather_bridge/uplink.js
          grep -q "bmwweather-diagnostics.json" native/andrug_bmwweather_bridge/bridge.js
          echo "Diagnostics instrumentation present"
      - name: Probe MET Norway API
        run: |
          curl --fail --silent --show-error \
            -A "BMWWeatherBridge/0.2.2 https://github.com/andrug05/bmwweather/issues" \
            "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=56.6388&lon=47.8908" \
            -o /tmp/met-weather.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/met-weather.json','utf8')); if (!x.properties || !Array.isArray(x.properties.timeseries) || !x.properties.timeseries.length) process.exit(1); console.log('MET Norway forecast OK:', x.properties.timeseries.length, 'time steps')"
      - name: Validate JSON manifests
        run: |
          node -e "for (const f of ['native/andrug_bmwweather_bridge/component.json','native/andrug_bmwweather_bridge/config.json','config.example.json','mgu-repo.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON manifests OK')"
