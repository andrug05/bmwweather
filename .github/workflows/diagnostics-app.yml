name: Validate BMW Weather Diagnostics OAP app

on:
  push:
    branches: [main]
    paths:
      - 'apps/andrug_bmwweather_diagnostics/**'
      - 'mgu-repo.json'
      - '.github/workflows/diagnostics-app.yml'
  pull_request:
    paths:
      - 'apps/andrug_bmwweather_diagnostics/**'
      - 'mgu-repo.json'
      - '.github/workflows/diagnostics-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-oap-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source module
        run: node --check apps/andrug_bmwweather_diagnostics/src/diagnostics.js
      - name: Validate OAP metadata and RHMI description
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('apps/andrug_bmwweather_diagnostics')
          app = json.loads((root/'mgu-app.json').read_text())
          pkg = json.loads((root/'package/package.json').read_text())
          rhmi = json.loads((root/'package/rhmiData/application.json').read_text())
          ui = json.loads((root/'package/rhmiData/uiDescriptions/ID7/uiDescription.json').read_text())
          repo = json.loads(pathlib.Path('mgu-repo.json').read_text())
          assert app['schema'] == 1 and app['tree'] == 'package'
          assert app['id'] == pkg['name'] == rhmi['application']['name']
          assert app['version'] == pkg['version'] == rhmi['application']['version']
          assert app['id'] in [c['id'] for c in repo['components']]
          assert 'ID7' in rhmi['application']['uiDescriptions'][0]['hmi']
          assert '1' in ui['containers']
          ET.parse(root/'package/rhmiData/uiDescriptions/ID7/application.xml')
          for rel in pkg['files']:
              assert (root/'package'/rel).exists(), f'missing package file: {rel}'
          for module in app['modules']:
              assert (root/module).is_file(), f'missing module: {module}'
          print('OAP source metadata, package files and RHMI XML are valid')
          PY
